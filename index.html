<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <h1><em>The</em> Book <em>of</em> Chris T.</h1>
  <h2>Chapter 1, Verse 1</h2>
  <p>"Thou shalt not smell thine own farts and grin, for what is fragrant unto thee is an abomination unto thy neighbor."</p>
  <p>— Chris T.</p>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" aria-label="Open book illustration">
    <!-- Left page -->
    <path d="M150,30 Q90,28 30,40 L30,170 Q90,158 150,160 Z" fill="#f5f0e8" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M150,30 Q210,28 270,40 L270,170 Q210,158 150,160 Z" fill="#f5f0e8" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Spine curve -->
    <path d="M150,30 Q146,95 150,160" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Left page lines -->
    <line x1="55" y1="65"  x2="138" y2="63"  stroke="#aaa" stroke-width="1"/>
    <line x1="52" y1="80"  x2="136" y2="78"  stroke="#aaa" stroke-width="1"/>
    <line x1="50" y1="95"  x2="135" y2="93"  stroke="#aaa" stroke-width="1"/>
    <line x1="48" y1="110" x2="134" y2="108" stroke="#aaa" stroke-width="1"/>
    <line x1="47" y1="125" x2="133" y2="123" stroke="#aaa" stroke-width="1"/>
    <line x1="46" y1="140" x2="132" y2="138" stroke="#aaa" stroke-width="1"/>
    <!-- Right page lines -->
    <line x1="162" y1="63"  x2="245" y2="65"  stroke="#aaa" stroke-width="1"/>
    <line x1="164" y1="78"  x2="248" y2="80"  stroke="#aaa" stroke-width="1"/>
    <line x1="165" y1="93"  x2="250" y2="95"  stroke="#aaa" stroke-width="1"/>
    <line x1="166" y1="108" x2="252" y2="110" stroke="#aaa" stroke-width="1"/>
    <line x1="167" y1="123" x2="253" y2="125" stroke="#aaa" stroke-width="1"/>
    <line x1="168" y1="138" x2="254" y2="140" stroke="#aaa" stroke-width="1"/>
    <!-- Book cover shadow at bottom -->
    <path d="M30,170 Q90,160 150,162 Q210,160 270,170 L272,178 Q210,168 150,170 Q90,168 28,178 Z" fill="#ccc" stroke="none"/>
  </svg>
